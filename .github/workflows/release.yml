name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # Declaring any permissions block replaces the default set, so contents:
      # read must be listed explicitly -- actions/checkout cannot clone a
      # private repo without it, and reports the failure as "Repository not
      # found" rather than as a permission error.
      contents: read
      # Required for PyPI trusted publishing (OIDC). No API token is stored.
      id-token: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Verify the tag matches the packaged version
        run: |
          # uv build takes the version from pyproject.toml while the formula URL
          # is derived from the tag. If they disagree, the emitted stanza points
          # at a file that was never published -- fail here, not after publishing.
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${tag_version}, but pyproject.toml declares ${pkg_version}. Bump pyproject.toml or retag."
            exit 1
          fi
          echo "tag and package version agree: ${pkg_version}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the SPA
        run: |
          cd web
          npm ci
          npm run build

      - name: Stage the built SPA inside the package
        run: |
          mkdir -p src/valcore/web_dist
          cp -r web/dist/* src/valcore/web_dist/

      - name: Build the wheel and sdist
        run: uv build

      - name: Verify the wheel ships the API and the built UI
        run: |
          contents=$(unzip -l dist/*.whl)
          echo "$contents"
          if ! echo "$contents" | grep -q "valcore/api/"; then
            echo "::error::wheel is missing valcore/api/ — the API layer did not ship"
            exit 1
          fi
          if ! echo "$contents" | grep -q "valcore/web_dist/index.html"; then
            echo "::error::wheel is missing valcore/web_dist/index.html — the UI did not ship"
            exit 1
          fi
          echo "wheel contains both valcore/api/ and valcore/web_dist/index.html"

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Emit the Homebrew formula stanza in the job summary
        run: |
          # The formula downloads the PyPI sdist, so hash exactly that file.
          # These bytes are what the publish step uploaded, and PyPI artifacts
          # are immutable -- so this sha256 stays valid forever.
          tarball=$(ls dist/*.tar.gz)
          sha=$(sha256sum "$tarball" | cut -d' ' -f1)
          version="${GITHUB_REF_NAME#v}"
          url="https://files.pythonhosted.org/packages/source/v/valcore/valcore-${version}.tar.gz"
          {
            echo "## Homebrew formula stanza"
            echo ""
            echo "Paste into \`Formula/valcore.rb\` in duncankmckinnon/homebrew-tap:"
            echo ""
            echo '```ruby'
            echo "  url \"${url}\""
            echo "  sha256 \"${sha}\""
            echo '```'
            echo ""
            echo "The release does not auto-publish a formula; open that PR by hand."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the published sdist matches the hash we emitted
        run: |
          # Guards against publishing a formula stanza that brew cannot verify.
          version="${GITHUB_REF_NAME#v}"
          url="https://files.pythonhosted.org/packages/source/v/valcore/valcore-${version}.tar.gz"
          local_sha=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)
          for attempt in 1 2 3 4 5; do
            remote_sha=$(curl -sfL "$url" | sha256sum | cut -d' ' -f1) && break
            echo "sdist not visible on PyPI yet (attempt ${attempt}); waiting…"
            sleep 15
          done
          if [ "$remote_sha" != "$local_sha" ]; then
            echo "::error::published sdist sha256 ($remote_sha) != built sdist ($local_sha)"
            exit 1
          fi
          echo "published sdist matches: $local_sha"
