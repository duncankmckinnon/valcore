name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # Declaring any permissions block replaces the default set, so contents:
      # read must be listed explicitly -- actions/checkout cannot clone a
      # private repo without it, and reports the failure as "Repository not
      # found" rather than as a permission error.
      contents: read
      # Required for PyPI trusted publishing (OIDC). No API token is stored.
      id-token: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          # hatch-vcs reads the version out of `git describe`, so the tag and the
          # history behind it have to be present. The default shallow, tagless
          # checkout would resolve to the fallback version instead.
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the SPA
        run: |
          cd web
          npm ci
          npm run build

      - name: Stage the built SPA inside the package
        run: |
          mkdir -p src/valcore/web_dist
          cp -r web/dist/* src/valcore/web_dist/

      - name: Build the wheel and sdist
        run: uv build

      - name: Resolve the published version from the built sdist
        id: resolve
        run: |
          # The sdist filename carries the PEP 440-normalized version that PyPI
          # will actually serve, so every later step reads it from here rather
          # than re-deriving it from the tag -- `v0.0.2-rc1` and `v0.0.2rc1` both
          # normalize to `0.0.2rc1`, and only the filename knows which won.
          tarball=$(ls dist/*.tar.gz)
          version=$(basename "$tarball" .tar.gz)
          version="${version#valcore-}"
          case "$version" in
            0.0.0|*.dev*|*+*)
              echo "::error::built version is ${version}, which means hatch-vcs could not see tag ${GITHUB_REF_NAME}. Check that the tag was pushed and that checkout used fetch-depth: 0."
              exit 1
              ;;
          esac
          # An rc/alpha/beta still goes to PyPI, but must not land in the tap:
          # the formula has no channel concept, so writing a prerelease there
          # would hand it to everyone running a plain `brew install valcore`.
          # This is deliberately stricter than workbench and thirdeye, which
          # publish prereleases to the tap.
          case "$version" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          echo "building and publishing version ${version} from tag ${GITHUB_REF_NAME} (prerelease=${prerelease})"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Verify the wheel ships the API and the built UI
        run: |
          contents=$(unzip -l dist/*.whl)
          echo "$contents"
          if ! echo "$contents" | grep -q "valcore/api/"; then
            echo "::error::wheel is missing valcore/api/ — the API layer did not ship"
            exit 1
          fi
          if ! echo "$contents" | grep -q "valcore/web_dist/index.html"; then
            echo "::error::wheel is missing valcore/web_dist/index.html — the UI did not ship"
            exit 1
          fi
          echo "wheel contains both valcore/api/ and valcore/web_dist/index.html"

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Record what was published in the job summary
        run: |
          # The formula downloads the PyPI sdist, so hash exactly that file.
          # These bytes are what the publish step uploaded, and PyPI artifacts
          # are immutable -- so this sha256 stays valid forever.
          tarball=$(ls dist/*.tar.gz)
          sha=$(sha256sum "$tarball" | cut -d' ' -f1)
          url="https://files.pythonhosted.org/packages/source/v/valcore/valcore-${VERSION}.tar.gz"
          {
            echo "## Published valcore ${VERSION}"
            echo ""
            echo "- sdist: ${url}"
            echo "- sha256: \`${sha}\`"
            echo ""
            if [ "${{ steps.resolve.outputs.prerelease }}" = "true" ]; then
              echo "Prerelease — the Homebrew tap was **not** updated. Run the"
              echo "\"Update Homebrew Tap (Manual)\" workflow if you want it there anyway."
            else
              echo "The update-homebrew-tap job publishes the formula to"
              echo "duncankmckinnon/homebrew-tap automatically."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the published sdist matches the hash we emitted
        run: |
          # Guards against publishing a formula stanza that brew cannot verify.
          url="https://files.pythonhosted.org/packages/source/v/valcore/valcore-${VERSION}.tar.gz"
          local_sha=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)
          for attempt in 1 2 3 4 5; do
            remote_sha=$(curl -sfL "$url" | sha256sum | cut -d' ' -f1) && break
            echo "sdist not visible on PyPI yet (attempt ${attempt}); waiting…"
            sleep 15
          done
          if [ "$remote_sha" != "$local_sha" ]; then
            echo "::error::published sdist sha256 ($remote_sha) != built sdist ($local_sha)"
            exit 1
          fi
          echo "published sdist matches: $local_sha"

  update-homebrew-tap:
    # Skipped for rc/alpha/beta tags: the tap has a single stable formula, so a
    # prerelease landing there would reach every `brew install valcore`. Publish
    # one deliberately via the "Update Homebrew Tap (Manual)" workflow.
    if: needs.build-and-publish.outputs.prerelease == 'false'
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew tap
        uses: ./.github/actions/update-homebrew-tap
        with:
          # Taken from the build job rather than re-derived from the tag, so the
          # formula URL uses the same PEP 440-normalized version PyPI served.
          version: ${{ needs.build-and-publish.outputs.version }}
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
