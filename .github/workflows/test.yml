name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      # Runs the same hooks contributors get locally, so CI and a clean
      # `git commit` can never disagree about formatting.
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies on Python ${{ matrix.python-version }}
        run: uv sync --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q --cov=valcore --cov-report=xml

      # One upload is enough -- the matrix runs the same suite, so the other
      # versions would only add duplicate reports for Codecov to merge.
      # fail_ci_if_error stays false so a missing or rotated CODECOV_TOKEN
      # degrades the badge rather than failing an otherwise-green build.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      # `npm run build` runs tsc --noEmit before vite, so this is the
      # typecheck as well as the build.
      - name: Build the SPA
        run: npm run build
        working-directory: web
      - name: Run web tests
        run: npx vitest run
        working-directory: web
