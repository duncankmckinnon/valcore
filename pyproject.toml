[project]
name = "valcore"
version = "0.0.1"
description = "A small, self-contained local tool for developing, improving, and running agentic evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic-ai>=2.19,<3",
    "pydantic-ai-harness[code-mode]>=0.12,<1",
    "sqlmodel",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "click",
]

[project.scripts]
valcore = "valcore.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "anyio",
    "httpx",
    # Pinned to a minor range: pre-commit shells out to this same ruff, so an
    # unpinned bump would change lint results in CI and locally at once.
    "ruff>=0.16,<0.17",
    "pre-commit>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valcore"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = [".agents", ".workbench", ".claude", "docs", "*.db", "*.db-shm", "*.db-wal"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
