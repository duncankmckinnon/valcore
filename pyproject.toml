[project]
name = "eval-core"
version = "0.1.0"
description = "A small, self-contained local tool for developing, improving, and running agentic evaluations."
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=2.19,<3",
    "pydantic-ai-harness[code-mode]>=0.12,<1",
    "sqlmodel",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "anyio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalcore"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
